openapi: 3.0.3
info:
  title: PHP Hub REST Service API
  version: "1.0"
  description: API REST generada automáticamente para el servicio PHP (Slim) del proyecto HUB.
servers:
  - url: http://localhost:8083
paths:
  /api/v1/auth/login:
    post:
      summary: Obtener token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        "200":
          description: Token emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "401":
          description: Credenciales inválidas
  /api/v1/shipments:
    get:
      summary: Listar envíos (protegido)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista de envíos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shipment'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Shipment:
      type: object
      properties:
        trackingNumber:
          type: string
        origin:
          type: string
        destination:
          type: string
        weightKg:
          type: number
        status:
          type: string
        updatedAt:
          type: string